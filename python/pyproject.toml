[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allevitas-agent-kit"
version = "1.2.0"
description = "Official Python SDK and CLI for Allevitas AI agent platform"
readme = "README.md"
authors = [{ name = "Allevitas Project" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
allevitas = "allevitas.cli:main"

[project.urls]
Homepage = "https://allevitas.com"
Repository = "https://github.com/kofuseigetsu/allevitas-agent-kit"

[tool.setuptools.packages.find]
where = ["."]
include = ["allevitas*"]
