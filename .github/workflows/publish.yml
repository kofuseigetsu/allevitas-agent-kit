name: Publish to PyPI & npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publishing)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/allevitas-agent-kit
    permissions:
      id-token: write # Trusted Publishing (OIDC) に必須
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Distribution (sdist & wheel)
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-npm:
    name: Publish to npm (Provenance & Automation Token)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance 署名に必須
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install Dependencies & Build
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
