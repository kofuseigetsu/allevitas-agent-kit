name: Test Publish (TestPyPI & npm dry-run)

on:
  workflow_dispatch:

jobs:
  test-pypi-publish:
    name: Publish to TestPyPI (OIDC)
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/allevitas-agent-kit
    permissions:
      id-token: write # Trusted Publishing (OIDC) に必須
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Distribution (sdist & wheel)
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/dist/
          skip-existing: true

  test-npm-dry-run:
    name: Test npm Publish (Dry Run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install Dependencies & Build
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Dry Run npm Publish
        working-directory: typescript
        run: npm publish --dry-run
